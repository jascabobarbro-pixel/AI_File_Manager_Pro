name: Android Build CI

on:
  push:
    branches:
      - '*'
      - '!master'
      - '!release/*'

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_spotless:
    name: Check spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check formatting
        run: ./gradlew spotlessCheck --stacktrace

  build:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up NDK
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410
        with:
          ndk-version: r28c
          link-to-sdk: true
          local-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Rust for Android
        working-directory: file_operations
        run: |
          rustup target add aarch64-linux-android
          bash ./setup_rust_android.sh

      - name: Restrict native build to ARM64
        run: |
          sed -i 's/targets = \["arm", "arm64", "x86", "x86_64"\]/targets = ["arm64"]/' file_operations/build.gradle
          grep -F 'targets = ["arm64"]' file_operations/build.gradle

      - name: Restrict APK to ARM64
        run: |
          cat > arm64.init.gradle <<'EOF'
          gradle.projectsEvaluated {
              def app = rootProject.findProject(":app")
              if (app != null) {
                  app.android.defaultConfig.ndk.abiFilters.clear()
                  app.android.defaultConfig.ndk.abiFilters.add("arm64-v8a")
              }
          }
          EOF

      - name: Assemble ARM64 debug APK
        run: ./gradlew -I arm64.init.gradle :app:assembleFdroidDebug --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(find app/build/outputs/apk/fdroid/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" "dist/$(basename "$apk" .apk)-arm64-v8a-$(git rev-parse --short HEAD).apk"
          ls -lh dist/

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
