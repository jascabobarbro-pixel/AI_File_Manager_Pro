name: Android Build CI

on:
  push:
    branches:
      - '*'
      - '!master'
      - '!release/*'
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_spotless:
    name: Check spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
      - name: Set up NDK
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410
        with:
          ndk-version: r28c
          link-to-sdk: true
          local-cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Setup Rust for Android
        run: |
          cd file_operations
          chmod +x setup_rust_
          android.sh
          ./setup_rust_android.sh
      - name: Verify Rust setup
        run: |
          cd file_operations
          echo "🔍 Verifying Rust Android targets..."
          rustup target list --installed | grep android || echo "No Android targets found"
          echo "🔍 Verifying cargo configuration..."
          if [ -f .cargo/config.toml ]; then
            echo "✅ .cargo/config.toml exists"
          else
            echo "❌ .cargo/config.toml missing"
            exit 1
          fi
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Check formatting using spotless
        run: ./gradlew spotlessCheck --stacktrace

  build:
    name: Build debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
      - name: Bootstrap web-ui lockfile
        working-directory: web-ui
        run: |
          if [ -f bun.lock ]; then
            echo "bun.lock present"
          else
            echo "bun.lock missing -> generating from pnpm-lock.yaml pins"
            bun install
          fi
          
      - name: Generate default debug signing key
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        
      - name: Assemble debug APKs
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Collect debug APKs
        run: |
          mkdir -p dist
          short=$(git rev-parse --short HEAD)
          for apk in app/build/outputs/apk/debug/*.apk; do
            base=$(basename "$apk" .apk)
            cp "$apk" "dist/${base}-${short}.apk"
          done
          ls -la dist/

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: rikkalaw-us-debug-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
